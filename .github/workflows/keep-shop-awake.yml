# Render's free plan puts the banner/merch server to sleep after 15 minutes with no visitors, and the first
# visitor after that waits for it to wake up. This pings it every 10 minutes so it stays awake. Asking for
# /merch (rather than /health) also keeps the server's copy of the Printful products fresh.
# GitHub sometimes runs scheduled jobs late, so once in a while the server may still nap.
name: Keep the shop awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the server
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 -o /dev/null -w "%{http_code} in %{time_total}s\n" https://joe-meier-banner.onrender.com/merch
